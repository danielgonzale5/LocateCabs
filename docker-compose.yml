# Local demo: MySQL plus the app. Create .env first with `npm run init-env`.
#
# Hardening:
# - the database sits on an internal network with no route out, and nothing
#   publishes its port;
# - both containers run with no Linux capabilities beyond what their entrypoint
#   needs, cannot gain privileges, and have a read-only root filesystem;
# - the app has memory and process limits.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?run npm run init-env first}
      MYSQL_DATABASE: ${DB_NAME:-locatecabs}
      APP_DB_USER: ${DB_USER}
      APP_DB_PASS: ${DB_PASS}
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/app-user.sh:/docker-entrypoint-initdb.d/02-app-user.sh:ro
      - db-data:/var/lib/mysql
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/mysqld
    cap_drop: [ALL]
    # The entrypoint starts as root to fix the data directory's ownership, then
    # switches to the mysql user; these are the capabilities that step needs.
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3020:3020/udp"
    # backend reaches the database; frontend is only there because Docker cannot
    # publish ports from an internal network.
    networks: [backend, frontend]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  db-data:
