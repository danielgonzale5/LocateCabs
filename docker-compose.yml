# Local demo: MySQL plus the app. Create .env first with `npm run init-env`.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:?run npm run init-env first}
      MYSQL_DATABASE: ${DB_NAME:-locatecabs}
      APP_DB_USER: ${DB_USER}
      APP_DB_PASS: ${DB_PASS}
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/app-user.sh:/docker-entrypoint-initdb.d/02-app-user.sh:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3020:3020/udp"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
